<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aula COIL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600&display=swap">
<!--
  Aula COIL · prototipo funcional
  Un solo archivo: HTML + CSS + JavaScript puro. Sin frameworks, sin npm, sin build.
  Para cambiar textos: objeto T. Para cambiar datos de ejemplo: función seed().
  Los datos se guardan en localStorage (solo en este navegador).
-->
<style>
/* Layout: barra superior azul marino al estilo del aula virtual EPN,
   contenido en columna principal + columna lateral de bloques (como Moodle). */
:root {
  --navy: #1b2a4b;        /* barra superior y botones (estilo aula virtual EPN) */
  --navy-2: #2a3d66;
  --gold: #f2b632;        /* acento dorado institucional */
  --red: #c8432b;         /* rojo del escudo, solo para atrasos */
  --bg: #f5f6f9;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --line: #dde2ea;
  --fg: #1d2433;
  --muted: #5b6577;
  --on-navy: #ffffff;
  --btn: #1b2a4b;
  --btn-fg: #ffffff;
  --link: #1f4f9c;
  --ok: #2b7a4b;
  --ok-bg: #e3f3ea;
  --warn: #8a5a00;
  --warn-bg: #fdf1d6;
  --bad: #b23a24;
  --bad-bg: #fbe4de;
  --event: #f6c9b2;
  --font-body: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-head: "Roboto Slab", Georgia, "Times New Roman", serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0d1730; --navy-2: #22355c; --gold: #f2b632; --red: #ef7a62;
    --bg: #0f1525; --surface: #161e33; --surface-2: #1d2742; --line: #2b3756;
    --fg: #e8ecf4; --muted: #a0aac0; --on-navy: #ffffff; --btn: #34528c; --btn-fg: #ffffff;
    --link: #8fb4ff; --ok: #6fd39b; --ok-bg: #173527; --warn: #f0c062; --warn-bg: #3a2e12;
    --bad: #ff8c74; --bad-bg: #42201a; --event: #5b3627; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #0d1730; --navy-2: #22355c; --gold: #f2b632; --red: #ef7a62;
  --bg: #0f1525; --surface: #161e33; --surface-2: #1d2742; --line: #2b3756;
  --fg: #e8ecf4; --muted: #a0aac0; --on-navy: #ffffff; --btn: #34528c; --btn-fg: #ffffff;
  --link: #8fb4ff; --ok: #6fd39b; --ok-bg: #173527; --warn: #f0c062; --warn-bg: #3a2e12;
  --bad: #ff8c74; --bad-bg: #42201a; --event: #5b3627; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
a { color: var(--link); }
h1, h2, h3 { font-family: var(--font-head); font-weight: 500; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; flex: none; }

/* ---------- barra superior ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--on-navy); }
.topbar-in { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }
.brand b { display: block; font-size: 1.15rem; letter-spacing: .02em; }
.brand small { display: block; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.mainnav { display: flex; gap: 4px; flex-wrap: wrap; }
.navbtn { background: none; border: 0; color: var(--on-navy); padding: 8px 12px; border-radius: var(--radius); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-size: .95rem; }
.navbtn:hover, .navbtn[aria-current="page"] { background: rgba(255,255,255,.12); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.55); border-radius: var(--radius); overflow: hidden; }
.seg button { background: none; border: 0; color: var(--on-navy); padding: 5px 10px; cursor: pointer; font-size: .82rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--on-navy); color: var(--navy); }
.tools select { background: var(--navy-2); color: var(--on-navy); border: 1px solid rgba(255,255,255,.4); border-radius: var(--radius); padding: 5px 8px; font-size: .85rem; max-width: 230px; }
.tools label { font-size: .8rem; opacity: .85; }
.outline-btn { background: none; color: var(--on-navy); border: 1px solid rgba(255,255,255,.7); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; font-size: .82rem; }
.outline-btn[aria-pressed="true"] { background: var(--gold); color: #1b2a4b; border-color: var(--gold); font-weight: 600; }
.demo-bar { background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: .8rem; }
.demo-bar > div { max-width: 1320px; margin: 0 auto; padding: 6px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; font-size: inherit; }

/* ---------- estructura ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 48px; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
@media (max-width: 960px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
.block { border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
.block + .block { margin-top: 24px; }
.block-h { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.block-h h2 { font-size: 1.6rem; display: flex; gap: 10px; align-items: center; }
.btn { background: var(--btn); color: var(--btn-fg); border: 0; border-radius: var(--radius); padding: 9px 16px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-weight: 500; text-decoration: none; font-size: .92rem; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.small { padding: 6px 11px; font-size: .84rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* tarjetas de proyecto: mismas proporciones que "Course overview" */
.course { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; border-radius: 2px; }
.course + .course { margin-top: 8px; }
.course:hover { border-color: var(--navy-2); }
.chev { color: var(--navy); }
:root[data-theme="dark"] .chev { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chev { color: var(--gold); } }
.chev svg { width: 64px; height: 64px; stroke-width: 3.2; }
.course-meta { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.course-title { font-family: var(--font-head); font-size: 1.3rem; text-transform: uppercase; margin: 2px 0; line-height: 1.3; }
.course-sub { font-size: .88rem; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 10px; max-width: 420px; }
.bar > span { display: block; height: 100%; background: var(--navy-2); }
:root[data-theme="dark"] .bar > span { background: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar > span { background: var(--gold); } }
.bar-label { font-size: .8rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .course { grid-template-columns: 40px minmax(0,1fr); } .chev svg { width: 36px; height: 36px; } .course .pill { grid-column: 2; justify-self: start; } }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; letter-spacing: .02em; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--navy); color: var(--on-navy); }
.inst { font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 3px; letter-spacing: .05em; }
.inst.epn { background: var(--navy); color: var(--on-navy); }
.inst.pu { background: var(--gold); color: #1b2a4b; }
.lang { font-size: .68rem; font-weight: 700; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--muted); text-transform: uppercase; }
.mchip { display: inline-flex; gap: 6px; align-items: center; font-size: .75rem; padding: 3px 9px; border-radius: 4px; border: 1px dashed #f08c1a; color: var(--fg); background: var(--surface); font-weight: 500; }
.mchip b { color: #e07c0e; }

/* bloques laterales */
.side-list { list-style: none; margin: 0; padding: 0; }
.side-list li { padding: 12px 4px; border-bottom: 1px solid var(--line); }
.side-list .t { display: flex; gap: 8px; align-items: baseline; }
.side-list .d { font-size: .86rem; margin-top: 2px; }
.clock { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); gap: 8px; }
.clock .h { font-family: var(--font-head); font-size: 1.6rem; font-variant-numeric: tabular-nums; }

/* ---------- vista de proyecto ---------- */
.crumbs { font-size: .85rem; color: var(--muted); margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.hero { background: var(--surface); border: 1px solid var(--line); padding: 20px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px 24px; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0,1fr); } }
.hero h1 { font-size: 1.7rem; text-transform: uppercase; line-height: 1.25; margin: 4px 0 6px; }
.hero .facts { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.integr { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 220px; }
.integr .cap { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

.phases { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; counter-reset: ph; }
.phases li { background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; font-size: .86rem; position: relative; }
.phases li .n { font-family: var(--font-head); font-size: 1.15rem; display: block; }
.phases li.done { color: var(--muted); }
.phases li.current { border-color: var(--navy-2); box-shadow: inset 0 -4px 0 var(--gold); }
@media (max-width: 680px) { .phases { grid-template-columns: repeat(2, minmax(0,1fr)); } }

.tabs { display: flex; gap: 2px; margin-top: 18px; border-bottom: 2px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { background: none; border: 0; padding: 10px 14px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--navy-2); font-weight: 600; }
:root[data-theme="dark"] .tab[aria-selected="true"] { border-bottom-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-selected="true"] { border-bottom-color: var(--gold); } }
.panel { padding-top: 18px; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-h h2 { font-size: 1.3rem; }

.phase-group + .phase-group { margin-top: 22px; }
.phase-group > h3 { font-size: 1rem; color: var(--muted); margin-bottom: 8px; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.act { background: var(--surface); border: 1px solid var(--line); }
.act + .act { margin-top: 6px; }
.act-head { width: 100%; background: none; border: 0; display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; text-align: left; }
.kicon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--navy-2); }
:root[data-theme="dark"] .kicon { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kicon { color: var(--gold); } }
.act-title { font-weight: 600; display: block; }
.act-meta { font-size: .84rem; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; }
.act-body { padding: 4px 16px 16px 64px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
@media (max-width: 560px) { .act-body { padding-left: 16px; } .act-head { grid-template-columns: 30px minmax(0,1fr); } .act-head .pill, .act-head .count { grid-column: 2; justify-self: start; } .kicon { width: 30px; height: 30px; } }
.when .alt { color: var(--muted); }
.box { background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; font-size: .92rem; }
.box p { margin: 0 0 6px; }

form.stack { display: grid; gap: 10px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: .82rem; font-weight: 600; }
.field small { color: var(--muted); font-size: .78rem; }
input[type=text], input[type=url], input[type=email], input[type=date], input[type=datetime-local], input[type=number], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { min-height: 90px; resize: vertical; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; min-width: 0; }

.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 12px; }
.team.mine { border-color: var(--navy-2); box-shadow: inset 4px 0 0 var(--gold); }
.team h3 { font-size: 1.15rem; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.member { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.member:last-of-type { border-bottom: 0; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; background: var(--navy); color: var(--on-navy); }
.avatar.pu { background: var(--gold); color: #1b2a4b; }
.member .nm { font-weight: 600; font-size: .92rem; }
.member .sub { font-size: .78rem; color: var(--muted); }
.member select { width: auto; font-size: .8rem; padding: 4px 6px; }
.slot { margin-top: 10px; font-size: .84rem; background: var(--surface-2); padding: 8px 10px; border-radius: var(--radius); }

.forum { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .forum { grid-template-columns: minmax(0,1fr); } }
.post { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; }
.post + .post, .post-wrap + .post-wrap { margin-top: 8px; }
.post .replies { margin-top: 10px; display: grid; gap: 8px; }
.post .replies .post { background: var(--surface-2); border: 0; }
.post-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
.post-body { margin: 4px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.post-acts { display: flex; gap: 14px; font-size: .82rem; }
.post-acts a, .post-acts button { color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; font-size: inherit; }
.tips { margin: 0; padding-left: 18px; font-size: .88rem; display: grid; gap: 6px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; }
.grade-grid { display: grid; grid-template-columns: 320px minmax(0,1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grade-grid { grid-template-columns: minmax(0,1fr); } }
.queue { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.queue button { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.queue button[aria-current="true"] { border-color: var(--navy-2); box-shadow: inset 4px 0 0 var(--gold); }
.queue .s { font-size: .8rem; color: var(--muted); }
.crit { display: grid; grid-template-columns: minmax(0,1fr) 90px; gap: 10px; align-items: center; }

.badge-card { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 18px; align-items: center; }
@media (max-width: 520px) { .badge-card { grid-template-columns: minmax(0,1fr); } }
.medal { width: 120px; height: 120px; }
.medal.locked { filter: grayscale(1); opacity: .45; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.checklist li { display: flex; gap: 10px; align-items: center; font-size: .92rem; }
.tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); flex: none; }
.tick.on { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.tick svg { width: 14px; height: 14px; stroke-width: 3; }

.cal-day { margin-top: 18px; }
.cal-day h3 { font-family: var(--font-body); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.cal-item { background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; display: grid; grid-template-columns: 6px minmax(0,1fr); gap: 12px; }
.cal-item + .cal-item { margin-top: 6px; }
.cal-item .stripe { background: var(--event); border-radius: 3px; }
.cal-item .stripe.session { background: var(--navy-2); }

/* muro de videos (estilo Padlet), plan e informe */
.wall { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.wcol { min-width: 0; background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 10px; align-content: start; }
.wcol > h3 { font-size: 1.05rem; padding: 2px 4px; display: flex; justify-content: space-between; gap: 8px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.wcard .post-head { flex-wrap: nowrap; }
.vid { aspect-ratio: 16 / 9; max-width: 100%; background: linear-gradient(135deg, var(--navy), var(--navy-2)); border-radius: 4px; display: grid; place-items: center; text-decoration: none; }
.vid span { width: 52px; height: 52px; border-radius: 50%; background: var(--gold); color: #1b2a4b; display: grid; place-items: center; }
.vid svg.i { width: 24px; height: 24px; fill: currentColor; stroke: currentColor; }
.vid:hover span { filter: brightness(1.08); }
.wact { display: flex; gap: 12px; align-items: center; font-size: .85rem; flex-wrap: wrap; }
.like { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.like.on { color: var(--red); border-color: var(--red); }
.like.on svg.i { fill: currentColor; }
.cmts { display: grid; gap: 6px; font-size: .85rem; border-top: 1px solid var(--line); padding-top: 8px; }
.cmt { overflow-wrap: anywhere; }
.cmt-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.cmt-form input { padding: 6px 8px; font-size: .85rem; }
.chk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 6px 16px; }
.wc { color: var(--muted); font-variant-numeric: tabular-nums; }
.wc.over { color: var(--bad); font-weight: 600; }
.plan h3 { font-size: 1.1rem; margin: 22px 0 8px; font-family: var(--font-head); font-weight: 500; }
.plan > h3:first-child { margin-top: 0; }
.plan ul { margin: 0; padding-left: 20px; }
.plan p { margin: 4px 0 8px; }
.meter { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; margin-top: 10px; max-width: 420px; }
.meter > span { display: block; height: 100%; background: var(--navy-2); border-radius: 5px; }
:root[data-theme="dark"] .meter > span { background: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .meter > span { background: var(--gold); } }
.meter > i { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--red); border-radius: 2px; }

.overlay { position: fixed; inset: 0; background: rgba(10,15,30,.55); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { background: var(--surface); color: var(--fg); width: min(640px, 100%); max-height: 90vh; overflow: auto; border-radius: var(--radius); padding: 22px; border-top: 5px solid var(--gold); }
.modal h2 { font-size: 1.4rem; margin-bottom: 12px; }
.modal-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: var(--on-navy); padding: 10px 18px; border-radius: var(--radius); z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: .9rem; }
.empty { color: var(--muted); padding: 18px; text-align: center; background: var(--surface); border: 1px dashed var(--line); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .25s ease-out; } @keyframes up { from { transform: translate(-50%, 10px); opacity: 0; } } }

function fmt(iso, tz, opts) { return new Intl.DateTimeFormat(locale(), Object.assign({ timeZone: tz }, opts)).format(new Date(iso)); }
function rel(iso) {
  const diff = (new Date(iso) - Date.now()) / DAY; const rtf = new Intl.RelativeTimeFormat(locale(), { numeric: 'auto' });

/* Fecha en mi zona + hora en la(s) otra(s) universidad(es) del proyecto */
function when(iso, pid) {
  const my = me().tz;
  const zones = [...new Set((pid ? project(pid).institutions : db.institutions.map((i) => i.id)).map((i) => inst(i).tz))].filter((z) => z !== my);
  const main = fmt(iso, my, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const alt = zones.map((z) => fmt(iso, z, { weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }) + ' ' + (CITY[z] || z)).join(' · ');
  return `<span class="when"><strong>${esc(main)}</strong> ${esc(CITY[my] || my)}${alt ? ` <span class="alt">· ${esc(alt)}</span>` : ''}</span>`;
}
function tzOffsetMin(date, tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(date).map((x) => [x.type, x.value]));

function zonedToUtc(local, tz) {
  const [d, hm] = local.split('T'); const [y, mo, da] = d.split('-').map(Number); const [h, mi] = hm.split(':').map(Number);
  const guess = Date.UTC(y, mo - 1, da, h, mi);
  return new Date(guess - tzOffsetMin(new Date(guess), tz) * 6e4).toISOString();

/* Franja horaria común (08:00–20:00 locales) para todas las zonas de un equipo */
function meetingSlot(tzs) {
  const ok = [];
  for (let h = 0; h < 24; h++) {
    const d = new Date(); d.setUTCHours(h, 0, 0, 0);
    if (tzs.every((z) => { const lh = +fmt(d.toISOString(), z, { hour: '2-digit', hourCycle: 'h23' }); return lh >= 8 && lh < 20; })) ok.push(h);
  }
  if (!ok.length) return null;
  let best = [ok[0]], cur = [ok[0]];
  for (let i = 1; i < ok.length; i++) { cur = ok[i] === ok[i - 1] + 1 ? cur.concat(ok[i]) : [ok[i]]; if (cur.length > best.length) best = cur; }
  const s = new Date(); s.setUTCHours(best[0], 0, 0, 0); const e = new Date(s.getTime() + best.length * 36e5);
  return [...new Set(tzs)].map((z) => `${fmt(s.toISOString(), z, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })}–${fmt(e.toISOString(), z, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })} ${CITY[z] || z}`).join(' · ');
}

/* Progreso: entregas y reflexiones requeridas (las sesiones no cuentan) */
const required = (pid) => db.activities.filter((a) => a.projectId === pid && a.kind !== 'session').sort(byDate('due'));
function subFor(a, sid) {
  if (a.mode === 'team') { const tm = teamIdOf(a.projectId, sid); return tm ? db.submissions.find((s) => s.activityId === a.id && s.teamId === tm) : null; }
  return db.submissions.find((s) => s.activityId === a.id && s.authorId === sid);
}
const reflFor = (pid, sid, phase) => db.reflections.find((r) => r.projectId === pid && r.authorId === sid && r.phase === phase);
const evalFor = (sub) => sub && db.evaluations.find((e) => e.submissionId === sub.id);
const words = (s) => (String(s || '').trim().match(/\S+/g) || []).length;
/* Comentarios distintos que hizo una persona a publicaciones ajenas de una actividad con muro */
const commentsBy = (a, sid) => {
  const ids = db.submissions.filter((s) => s.activityId === a.id && s.authorId !== sid).map((s) => s.id);
  return new Set(db.comments.filter((c) => c.authorId === sid && ids.includes(c.targetId)).map((c) => c.targetId)).size;
};
const isDone = (a, sid) => (a.kind === 'reflection' ? !!reflFor(a.projectId, sid, a.phase) : !!subFor(a, sid) && commentsBy(a, sid) >= (a.minComments || 0));
const passPct = (pid) => (project(pid) || {}).passPct || 70;
/* Nota ponderada: cada actividad con peso aporta peso × (puntaje / 10). Solo cuenta lo ya calificado. */
function gradeOf(pid, sid) {
  let pct = 0, graded = 0, total = 0;
  db.activities.filter((a) => a.projectId === pid && a.weight > 0).forEach((a) => {
    total += a.weight; const ev = evalFor(subFor(a, sid));
    if (ev) { pct += (a.weight * ev.score) / 10; graded += a.weight; }
  });
  return { pct: Math.round(pct * 10) / 10, graded, total };
}
function progressOf(pid, sid) { const r = required(pid); return r.length ? Math.round((100 * r.filter((a) => isDone(a, sid)).length) / r.length) : 0; }
function courseProgress(pid) { const s = studentsOf(pid); return s.length ? Math.round(s.reduce((n, m) => n + progressOf(pid, m.personId), 0) / s.length) : 0; }
function currentPhase(pid) {

  return next ? next.phase : (db.activities.some((a) => a.projectId === pid) ? 4 : 1);
}
function statusOf(a, sid) {
  if (a.kind === 'session') return new Date(a.due) < Date.now() ? ['st_done', ''] : ['st_pending', 'info'];
  if (a.kind === 'reflection') return isDone(a, sid) ? ['st_done', 'ok'] : new Date(a.due) < Date.now() ? ['st_overdue', 'bad'] : ['st_pending', 'warn'];

      const s = new Date(f.start + 'T00:00:00Z').getTime(), e = new Date(f.end + 'T00:00:00Z').getTime(), span = Math.max(e - s, 28 * DAY);
      const mk = (frac, phase, kind, mode, es, en, extra) => db.activities.push(Object.assign({ id: uid('a'), projectId: pid, phase, kind, mode, title: { es, en }, instructions: '', weight: 0,
        due: new Date(s + span * frac + 21 * 36e5 + 59 * 6e4).toISOString() }, extra || {}));
      mk(0.08, 1, 'session', 'team', 'Sesión rompehielo', 'Icebreaker session');
      mk(0.15, 1, 'task', 'individual', 'Video rompehielo (1–3 min)', 'Icebreaker video (1–3 min)', { weight: 20, wall: true, minComments: 2 });
      mk(0.40, 2, 'task', 'team', 'Actividad colaborativa 1', 'Collaborative activity 1', { weight: 30 });
      mk(0.75, 3, 'task', 'team', 'Actividad colaborativa 2', 'Collaborative activity 2', { weight: 30 });
      mk(0.92, 4, 'session', 'team', 'Presentación final', 'Final presentation');
      mk(1.0, 4, 'task', 'individual', 'Reflexión final en video (1–3 min)', 'Final reflection video (1–3 min)', { weight: 20, wall: true, minComments: 0 });
    }
    Object.assign(ui, { view: 'project', projectId: pid, tab: 'teams', modal: null });
    toast(t('t_proj'));
  },
  // POST /api/v1/projects/:id/activities
  createActivity(f) {
    db.activities.push({ id: uid('a'), projectId: ui.projectId, phase: +f.phase, kind: f.kind, mode: f.kind === 'reflection' ? 'individual' : f.mode,
      title: ui.lang === 'es' ? { es: f.title, en: f.titleOther || f.title } : { en: f.title, es: f.titleOther || f.title },
      instructions: f.instructions, due: zonedToUtc(f.due, me().tz), weight: Math.max(0, +f.weight || 0), wall: !!f.wall, minComments: f.wall ? Math.max(0, +f.minComments || 0) : 0 });
    ui.form = null; toast(t('t_act'));
  },
  // POST /api/v1/activities/:id/submissions  (si ya existe: PATCH)
  submit(f, el) {
    const a = db.activities.find((x) => x.id === el.dataset.id); const sid = me().id; const prev = subFor(a, sid);
    const data = { body: f.body || '', linkUrl: f.linkUrl || '', submittedAt: new Date().toISOString(), authorId: sid };
    if (a.template) {
      const secs = a.template.map((_, i) => f['sec' + i] || '');
      if (a.template.some((sec, i) => words(secs[i]) > sec.max)) { toast(t('tooLong')); return false; }
      data.sections = secs; data.body = secs.join('\n\n');
    }
    if (prev) Object.assign(prev, data);
    else db.submissions.push(Object.assign({ id: uid('sb'), activityId: a.id, teamId: a.mode === 'team' ? teamIdOf(a.projectId, sid) : null }, data));
    toast(t('t_sub'));
  },
  // POST /api/v1/projects/:id/reflections
  reflect(f) {
    const phase = +f.phase; const prev = reflFor(ui.projectId, me().id, phase);
    if (prev) Object.assign(prev, { body: f.body, visibility: f.visibility, at: new Date().toISOString() });
    else db.reflections.push({ id: uid('rf'), projectId: ui.projectId, authorId: me().id, phase, body: f.body, visibility: f.visibility, at: new Date().toISOString() });
    toast(t('t_refl'));
  },
  // POST /api/v1/projects/:id/posts
  post(f) {
    db.posts.push({ id: uid('po'), projectId: ui.projectId, teamId: ui.channel === 'general' ? null : ui.channel, authorId: me().id,
      parentId: ui.replyTo, lang: ui.lang, at: new Date().toISOString(), body: f.body });
    ui.replyTo = null; toast(t('t_post'));
  },
  // POST /api/v1/submissions/:id/comments
  comment(f, el) { db.comments.push({ id: uid('c'), targetId: el.dataset.id, authorId: me().id, body: f.body, at: new Date().toISOString() }); toast(t('t_comment')); },
  // PUT /api/v1/projects/:id/plan
  plan(f) {
    const p = project(ui.projectId);
    p.passPct = Math.max(1, Math.min(100, +f.passPct || 70));
    p.plan = { objectives: f.objectives, ods: (f['ods[]'] || []).map(Number), strategy: f['strategy[]'] || [],
      tools: Object.fromEntries(['content', 'meet', 'chat', 'collab'].map((k) => [k, { tool: f['tool_' + k], url: f['url_' + k] }])),
      inst: Object.fromEntries(p.institutions.map((i) => [i, { schedule: f['sch_' + i], semStart: f['ss_' + i], semEnd: f['se_' + i], breaks: f['br_' + i] }])) };
    ui.form = null; toast(t('t_plan'));
  },
  // POST /api/v1/projects/:id/resources
  resource(f) { db.resources.push({ id: uid('r'), projectId: ui.projectId, title: f.title, url: f.url, lang: ui.lang }); ui.form = null; toast(t('t_res')); },
  // POST /api/v1/submissions/:id/evaluations
  grade(f, el) {
    const scores = RUBRIC.map((c, i) => Math.max(0, Math.min(c.max, +f['c' + i] || 0)));
    db.evaluations.push({ id: uid('ev'), submissionId: el.dataset.id, evaluatorId: me().id, scores, score: scores.reduce((a, b) => a + b, 0), feedback: f.feedback, at: new Date().toISOString() });
    ui.gradeSub = null; toast(t('t_grade'));
  },
  // POST /api/v1/projects/:id/members:import
  importStudents(f) {
    const lines = f.csv.split('\n').map((l) => l.split(',').map((x) => x.trim())).filter((l) => l[0]);
    lines.forEach(([name, email, code]) => {
      const i = db.institutions.find((x) => x.short.toLowerCase() === (code || '').toLowerCase()) || db.institutions[0];
      const p = { id: uid('s'), name, email: email || '', institutionId: i.id, kind: 'student', tz: i.tz, lang: i.lang };
      db.people.push(p); db.members.push({ projectId: ui.projectId, personId: p.id, role: 'student', teamId: null, badgeAt: null });
    });
    ui.form = null; toast(t('t_studs'));
  },
};

  downloadPlan: () => { const p = project(ui.projectId); downloadFile('plan-' + slug(L(p.title)) + '.doc', 'application/msword', wordDoc(t('planTitle') + ' · ' + L(p.title), planBody(p))); },

  downloadCsv: () => { const p = project(ui.projectId); downloadFile('notas-' + slug(L(p.title)) + '.csv', 'text/csv', '﻿' + gradesCsv(p)); },
  // POST /api/v1/projects/:id/badges   (en Moodle: Insignias)
  badge: (d) => { const m = member(ui.projectId, d.id); if (m) { m.badgeAt = new Date().toISOString(); toast(t('t_badge')); } },
  // POST /api/v1/projects/:id/teams:auto  — reparte por institución para que cada equipo quede mixto
  autoTeams: () => {
    const pid = ui.projectId; const studs = studentsOf(pid).sort((a, b) => person(a.personId).institutionId.localeCompare(person(b.personId).institutionId));
    const need = Math.max(1, Math.round(studs.length / 4)); let teams = teamsOf(pid);
    while (teams.length < need) { db.teams.push({ id: uid('tm'), projectId: pid, name: TEAM_NAMES[teams.length % TEAM_NAMES.length] }); teams = teamsOf(pid); }
    studs.forEach((m, i) => { m.teamId = teams[i % need].id; });

  addTeam: () => { const n = teamsOf(ui.projectId).length; db.teams.push({ id: uid('tm'), projectId: ui.projectId, name: TEAM_NAMES[n % TEAM_NAMES.length] + (n >= TEAM_NAMES.length ? ' ' + (n + 1) : '') }); },

function upcomingList(limit) {
  const items = [];
  myProjects().filter((p) => p.status === 'active').forEach((p) => db.activities.filter((a) => a.projectId === p.id && new Date(a.due) > Date.now() - DAY).forEach((a) => items.push(a)));
  items.sort(byDate('due'));
  return limit ? items.slice(0, limit) : items;
}

function tabGrades(p, teacher) {
  const u = me();
  if (!teacher) {
    const g = gradeOf(p.id, u.id); const pass = passPct(p.id);
    const rows = db.activities.filter((a) => a.projectId === p.id && a.weight > 0).sort(byDate('due')).map((a) => { const sb = subFor(a, u.id); const ev = evalFor(sb); const [st, cls] = statusOf(a, u.id);

        <div class="meter" role="img" aria-label="${g.pct} / 100"><span style="width:${Math.min(100, g.pct)}%"></span><i style="left:${pass}%" title="${esc(t('goal'))} ${pass}"></i></div>
        <p class="muted" style="margin:8px 0 0;font-size:.85rem">${esc(t('goal'))}: ${pass} · ${g.total - g.graded} ${esc(t('pendingPts'))}</p></div>
      <div class="table-wrap"><table><thead><tr><th>${esc(t('activity'))}</th><th>${esc(t('weight'))}</th><th>${esc(t('status'))}</th><th>${esc(t('score'))}</th><th>${esc(t('contributes'))}</th><th>${esc(t('feedback'))}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  const wsum = db.activities.filter((x) => x.projectId === p.id).reduce((n, x) => n + (x.weight || 0), 0);
  const subs = db.submissions.filter((s) => actIds.includes(s.activityId));

  const label = (s) => { const a = db.activities.find((x) => x.id === s.activityId); const who = s.teamId ? t('teamOf') + ' ' + (db.teams.find((x) => x.id === s.teamId) || {}).name : person(s.authorId).name; return [L(a.title), who]; };

      <div><div class="muted" style="font-size:.84rem">${esc(who)} · ${esc(rel(cur.submittedAt))}</div><h3 style="font-size:1.15rem">${esc(title)}</h3></div>

      <strong>${esc(t('rubric'))}</strong>

      <label class="field"><span>${esc(t('feedback'))} *</span><textarea id="f-fb" name="feedback" required></textarea></label>
      <div><button class="btn" type="submit">${esc(t('publishGrade'))}</button></div></form>`;
  }
  return `<div class="panel-h"><h2>${esc(t('tab_grades'))}</h2><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${wsum === 100 ? 'ok' : 'warn'}">${esc(t('weightSum'))}: ${wsum} %${wsum === 100 ? '' : ' · ' + esc(t('weightWarn'))}</span>${mchip('grades')}${mchip('weights')}</div></div>

      <ul class="queue">${done.map((s) => { const [ti, who] = label(s); return `<li class="card" style="padding:8px 12px"><strong>${esc(who)}</strong> · ${evalFor(s).score}/10<div class="muted" style="font-size:.8rem">${esc(ti)}</div></li>`; }).join('')}</ul>
    </div><div style="min-width:0">${formHtml}</div></div>`;

/* ---------- Descargas ---------- */
function downloadFile(name, mime, content) {
  try {
    const url = URL.createObjectURL(new Blob([content], { type: mime + ';charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); toast(t('downloaded'));
  } catch (e) { toast('No se pudo descargar el archivo.'); }
}

/* ---------- Informe de evidencias ---------- */
function reportData(p) {
  const pass = passPct(p.id);
  const studs = studentsOf(p.id).map((m) => { const pp = person(m.personId); const g = gradeOf(p.id, pp.id); const tm = db.teams.find((x) => x.id === m.teamId); return { m, pp, g, team: tm ? tm.name : '—', ok: g.pct >= pass }; });
  const acts = db.activities.filter((a) => a.projectId === p.id && a.weight > 0).sort(byDate('due'));
  const rows = acts.map((a) => { const subs = db.submissions.filter((s) => s.activityId === a.id); const evs = subs.map((s) => evalFor(s)).filter(Boolean);
    return { a, received: subs.length, expected: a.mode === 'team' ? teamsOf(p.id).length : studs.length, graded: evs.length, avg: evs.length ? evs.reduce((n, e) => n + e.score, 0) / evs.length : null }; });
  return { pass, studs, acts, rows, ok: studs.filter((x) => x.ok).length, badges: studs.filter((x) => x.m.badgeAt).length };
}

      ${d.rows.map((r) => `<tr><td>${esc(L(r.a.title))}</td><td>${r.a.weight} %</td><td>${r.received}/${r.expected}</td><td>${r.graded}</td><td>${r.avg == null ? '—' : r.avg.toFixed(1) + '/10'}</td></tr>`).join('')}</tbody></table></div>
    <h3>${esc(t('evidence'))}</h3>${evid.map((a) => `<p><strong>${esc(L(a.title))}</strong></p><ul>${db.submissions.filter((s) => s.activityId === a.id).map((s) => { const pp = person(s.authorId);
      return `<li>${esc(inst(pp.institutionId).short)}. ${esc(pp.name)}${s.linkUrl ? ` · <a href="${esc(s.linkUrl)}" target="_blank" rel="noopener">${esc(s.linkUrl)}</a>` : ''}</li>`; }).join('') || '<li>—</li>'}</ul>`).join('') || '<p>—</p>'}</div>`;
}
function tabReport(p) {
  return `<div class="panel-h"><h2>${esc(t('reportTitle'))}</h2><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${mchip('report')}
      <button class="btn ghost small" data-act="downloadCsv">${ic('chart')} ${esc(t('downloadCsv'))}</button>
      <button class="btn small" data-act="downloadReport">${ic('file')} ${esc(t('downloadReport'))}</button></div></div>${reportBody(p)}`;
}
/* CSV de notas (se abre en Excel). Los textos que parecen fórmulas se neutralizan. */
function gradesCsv(p) {
  const d = reportData(p); const q = (v) => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const head = [t('student'), 'Email', t('institution'), t('team')].concat(d.acts.map((a) => `${L(a.title)} (${a.weight}%)`), [`${t('gradeTotal')} (${t('ofHundred')})`, t('status'), t('badge')]);
  const rows = d.studs.map((x) => [x.pp.name, x.pp.email, inst(x.pp.institutionId).short, x.team]
    .concat(d.acts.map((a) => { const ev = evalFor(subFor(a, x.pp.id)); return ev ? ev.score : ''; }), [x.g.pct, x.ok ? t('passed') : t('notYet'), x.m.badgeAt ? x.m.badgeAt.slice(0, 10) : '']));
  return [head].concat(rows).map((r) => r.map(q).join(',')).join('\r\n');
}

function modal() {
  if (ui.modal === 'reset') {
    return `<div class="overlay" data-act="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" data-stop>
      <h2 id="m-title">${esc(t('reset'))}</h2><p>${esc(t('resetQ'))}</p>
      <div class="modal-acts"><button class="btn ghost" data-act="modal">${esc(t('cancel'))}</button><button class="btn" data-act="doReset">${esc(t('resetYes'))}</button></div></div></div>`;
  }
  if (ui.modal === 'newProject') {
    const today = new Date().toISOString().slice(0, 10); const later = new Date(Date.now() + 70 * DAY).toISOString().slice(0, 10);
    return `<div class="overlay" data-act="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" data-stop>
      <h2 id="m-title">${esc(t('newProject'))}</h2>
      <form class="stack" data-form="createProject">
        <label class="field"><span>${esc(t('title'))} *</span><input id="f-p-title" name="title" type="text" required placeholder="Ej. Energías renovables en los Andes y el Mar del Norte"></label>
        <label class="field"><span>${esc(t('titleOther'))}</span><input id="f-p-title2" name="titleOther" type="text"></label>
        <div class="row"><label class="field"><span>${esc(t('courseEpn'))} *</span><input id="f-p-c1" name="courseEpn" type="text" required></label>
          <label class="field"><span>${esc(t('coursePartner'))} *</span><input id="f-p-c2" name="coursePartner" type="text" required></label></div>
        <div class="row"><label class="field"><span>${esc(t('window'))}: ${esc(t('start'))} *</span><input id="f-p-start" name="start" type="date" required value="${today}"></label>
          <label class="field"><span>${esc(t('window'))}: ${esc(t('end'))} *</span><input id="f-p-end" name="end" type="date" required value="${later}"></label></div>
        <label class="field"><span>${esc(t('description'))}</span><textarea id="f-p-desc" name="description"></textarea></label>
        <div class="row"><label class="field"><span>${esc(t('meetUrl'))}</span><input id="f-p-meet" name="meetUrl" type="url" placeholder="https://"></label>
          <label class="field"><span>${esc(t('driveUrl'))}</span><input id="f-p-drive" name="driveUrl" type="url" placeholder="https://"></label></div>
        <label class="check"><input id="f-p-tpl" name="template" type="checkbox" checked> ${esc(t('useTemplate'))}</label>
        <div class="modal-acts"><button type="button" class="btn ghost" data-act="modal">${esc(t('cancel'))}</button><button class="btn" type="submit">${esc(t('create'))}</button></div>
      </form></div></div>`;
  }
  return '';
}

/* =====================================================================
   7. RENDER Y EVENTOS (delegación: un solo listener por tipo)
   ===================================================================== */
const $app = document.getElementById('app');
function render() {
  document.documentElement.lang = ui.lang;
  const body = ui.view === 'project' ? viewProject() : ui.view === 'calendar' ? viewCalendar() : viewHome();
  $app.innerHTML = header() + body + modal();
  save();
}
let toastTimer;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('overlay') && e.target.closest('[data-stop]')) return; // clic dentro del modal
  const fn = clickActions[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el); render();
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  changeActions[el.dataset.change](el.value, el); render();
});
document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form); const f = Object.fromEntries(fd.entries());
  new Set([...fd.keys()]).forEach((k) => { f[k + '[]'] = fd.getAll(k); });
  form.querySelectorAll('input[type=checkbox]:not([data-multi])').forEach((c) => { f[c.name] = c.checked; });
  Object.keys(f).forEach((k) => { if (typeof f[k] === 'string') f[k] = f[k].trim(); });
  if ([...form.querySelectorAll('[required]')].some((x) => !String(f[x.name] || '').trim())) { toast(t('need')); return; }
  if (actions[form.dataset.form](f, form) !== false) render();
});
document.addEventListener('input', (e) => {
  const el = e.target; if (!el.matches || !el.matches('textarea[data-max]')) return;
  const n = words(el.value); const c = document.querySelector(`[data-count="${el.id}"]`);
  if (c) { c.textContent = n + ' / ' + el.dataset.max; c.classList.toggle('over', n > +el.dataset.max); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); } });
setInterval(() => document.querySelectorAll('[data-clock]').forEach((el) => {
  el.textContent = fmt(new Date().toISOString(), el.dataset.clock, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
}), 30000);

render();
})();
</script>
